services:
  api:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: api
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        CODEX_VERSION: ${CODEX_VERSION:-0.145.0}
    ports:
      - "${PORT:-3009}:3009"
    env_file: .env
    environment:
      - DATABASE_URL=/data/aif.sqlite
      - PORT=3009
      - AIF_ENABLE_CODEX_LOGIN_PROXY=true
      - AGENT_INTERNAL_URL=http://agent:3010
      - AGENT_RUN_INTERNAL_URL=http://agent:3013
      - PROJECTS_DIR=${PROJECTS_DIR:-${PWD}/projects}
      - PROJECTS_HOST_ROOT=${PWD}
      - PROJECTS_MOUNT=${PROJECTS_MOUNT:-/home/www}
    volumes:
      - db-data:/data
      - ${PROJECTS_DIR:-${PWD}/projects}:${PROJECTS_MOUNT:-/home/www}
      - claude-auth:/home/node/.claude
      - codex-auth:/home/node/.codex
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: web
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        CODEX_VERSION: ${CODEX_VERSION:-0.145.0}
    ports:
      - "${WEB_PORT:-5180}:80"
    depends_on:
      - api
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: agent
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        CODEX_VERSION: ${CODEX_VERSION:-0.145.0}
    env_file: .env
    environment:
      - DATABASE_URL=/data/aif.sqlite
      - API_BASE_URL=http://api:3009
      - AGENT_BYPASS_PERMISSIONS=true
      - AIF_ENABLE_CODEX_LOGIN_PROXY=true
      - AIF_CODEX_LOGIN_BROKER_PORT=3010
      - AGENT_INTERNAL_URL=http://agent:3010
      - AIF_RUN_BROKER_PORT=3013
      - AGENT_RUN_INTERNAL_URL=http://agent:3013
      # Opt-in: lets the "Run" feature execute Docker/docker-compose commands
      # and publish ports for raw commands via `docker run -p`. Mounting the
      # Docker socket (below, commented out) is equivalent to root on the
      # host — combined with this container's existing LLM-driven shell
      # access, that raises the blast radius of any prompt-injection or
      # runaway-agent scenario from "contained to the worktree" to "full host
      # compromise". Only uncomment the volume mount and flip this to true if
      # you understand and accept that. See docs/configuration.md.
      - AIF_AGENT_DOCKER_SOCKET_ENABLED=${AIF_AGENT_DOCKER_SOCKET_ENABLED:-false}
      - AIF_RUN_WRAPPER_IMAGE=${AIF_RUN_WRAPPER_IMAGE:-}
      - PROJECTS_DIR=${PROJECTS_DIR:-${PWD}/projects}
      - PROJECTS_HOST_ROOT=${PWD}
      - PROJECTS_MOUNT=${PROJECTS_MOUNT:-/home/www}
    expose:
      - "3010"
      - "3013"
    volumes:
      - db-data:/data
      - ${PROJECTS_DIR:-${PWD}/projects}:${PROJECTS_MOUNT:-/home/www}
      - claude-auth:/home/node/.claude
      - codex-auth:/home/node/.codex
      # Uncomment to enable Docker-based Run commands (see
      # AIF_AGENT_DOCKER_SOCKET_ENABLED above — both are required together):
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - api
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: mcp
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        CODEX_VERSION: ${CODEX_VERSION:-0.145.0}
    ports:
      - "${MCP_PORT:-3100}:3100"
    env_file: .env
    environment:
      - DATABASE_URL=/data/aif.sqlite
      - MCP_TRANSPORT=http
      - MCP_PORT=3100
      - PROJECTS_DIR=${PROJECTS_DIR:-${PWD}/projects}
      - PROJECTS_HOST_ROOT=${PWD}
      - PROJECTS_MOUNT=${PROJECTS_MOUNT:-/home/www}
    volumes:
      - db-data:/data
      - ${PROJECTS_DIR:-${PWD}/projects}:${PROJECTS_MOUNT:-/home/www}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  claude-auth:
  codex-auth:
